<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business details - Northbridge Business Bank</title>
<style>body{font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;margin:0;color:#222}
header,nav,main,aside,section{display:block}
.bar{padding:8px 16px;background:#f3f3f3;border-bottom:1px solid #ddd}
.wrap{display:flex}nav.side{width:200px;padding:12px;background:#4a154b;color:#fff;min-height:480px}
nav.side ul{list-style:none;padding:0}main{flex:1;padding:16px;max-width:820px}
.msg{margin:10px 0}.msg b{margin-right:6px}.msg time{color:#777;font-size:12px}
pre,.clip{white-space:pre-wrap;font:13px/1.4 ui-monospace,Menlo,monospace;margin:4px 0}
.row{margin:10px 0}.row label{display:block;font-weight:600;margin-bottom:3px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=url],input:not([type]),textarea{width:100%;max-width:520px;padding:6px;border:1px solid #bbb;border-radius:4px}
[contenteditable]{min-height:48px;border:1px solid #bbb;border-radius:4px;padding:6px;max-width:700px}
h1{font-size:20px}h2{font-size:16px}fieldset{border:1px solid #ddd;margin:12px 0;max-width:620px}
</style>
</head>
<body>
<header class="bar" role="banner">Northbridge Business Bank</header>
<main>
<h1>Tell us about your business</h1>

<form><fieldset><legend>Business details</legend>
<div class="row"><label for="legal_name">Legal business name</label><input id="legal_name" name="legal_name" type="text" ></div><div class="row"><label for="ein">EIN</label><input id="ein" name="ein" type="text" ></div><div class="row"><label for="website">Website</label><input id="website" name="website" type="url" ></div><div class="row"><label for="phone">Business phone</label><input id="phone" name="phone" type="tel" ></div></fieldset>
<fieldset><legend>Business address</legend>
<div class="row"><label for="address1">Street address</label><input id="address1" name="address1" type="text" ></div><div class="row"><label for="city">City</label><input id="city" name="city" type="text" ></div><div class="row"><label for="state">State</label><input id="state" name="state" type="text" ></div><div class="row"><label for="zip">ZIP code</label><input id="zip" name="zip" type="text" ></div></fieldset>
<button type="submit">Continue</button></form>

</main>
</body>
</html>
